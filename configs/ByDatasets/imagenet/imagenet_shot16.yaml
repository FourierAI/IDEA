# ------ root_path/dataset_name ------
root_path: 'DATA'


# ------ Load Cache and Features ------
load_cache: False
load_pre_feat: False

# load_cache: True
# load_pre_feat: True


# ------ Hyperparamters ------
search_hp: True
# search_hp: False

search_scale: [7, 3]
search_step: [200, 20]

init_beta: 1
init_alpha: 1.17
init_theta: 0.3

best_beta: 1.89
best_alpha: 2.85
best_theta: 0.55

best_alpha_f: 1.84
best_beta_f: 0.58
best_theta_f: 0.3

# ------ Basic Config ------
dataset: 'imagenet'
shots: 16
backbone: 'RN50'

lr: 0.0001
augment_epoch: 10
train_epoch: 120