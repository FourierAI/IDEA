# ------ root_path/dataset_name ------
root_path: 'DATA'


# ------ Load Cache and Features ------
load_cache: False
load_pre_feat: False

# load_cache: True
# load_pre_feat: True


# ------ Hyperparamters ------
search_hp: True
# search_hp: False

search_scale: [12, 5]
search_step: [200, 20]

init_beta: 1
init_alpha: 3
init_theta: 0.3

best_beta: 2.06
best_alpha: 4.75
best_theta: 0.05

best_alpha_f: 0.84
best_beta_f: 2.84
best_theta_f: 0.1

# ------ Basic Config ------
dataset: 'caltech101'
shots: 1
# shots: 1
backbone: 'RN50'

lr: 0.00025
augment_epoch: 10
# augment_epoch: 1
# train_epoch: 20
train_epoch: 160